[package]
name = "h2viewer"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Fly-camera viewer for Halo 2 levels"

[dependencies]
blam-cache = { path = "../blam-cache" }
h2sim = { path = "../h2sim" }
bytemuck = { version = "1", features = ["derive"] }
glam = "0.33"
pollster = "1"
wgpu = "30"
winit = "0.30"
gilrs = "0.11.2"
cpal = "0.16"
h2net = { path = "../h2net" }
h2live = { path = "../h2live" }
