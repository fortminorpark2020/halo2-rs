[package]
name = "h2scene"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Halo 2's main menu scene (mainmenu.map's level, sky, scenery and flythrough): read as plain data, and drawn offscreen with wgpu for the launcher's lobby; no game files"

[dependencies]
# mainmenu.map's geometry, bitmaps, shaders and script, read from the
# player's own install at run time.
blam-cache = { path = "../blam-cache" }
glam = "0.33"
# The scene drawn offscreen and read back for the lobby's CPU canvas
# (render.rs, backdrop.rs), with h2viewer's versions.
wgpu = "30"
bytemuck = { version = "1", features = ["derive"] }
pollster = "1"

[dev-dependencies]
# The ignored real-map test and the scene_shot example write PNGs.
png = "0.17"
