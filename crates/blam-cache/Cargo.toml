[package]
name = "blam-cache"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Reader for Halo 2 PC (Vista) .map cache files"

[dependencies]
thiserror = "1"
flate2 = "1"
wma = { path = "../wma" }

[features]
# `mcc::synthetic`: builds made-up format-13 maps and textures.dat files
# for other crates' tests.
synthetic = []
