[package]
name = "h2relay"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The UDP relay that carries the launcher's engine packets between PCs, inside h2live"

[dependencies]
# Waiting for a packet (or a timer) on a socket that callers also send on
# without blocking; WSAPoll on Windows.
rustix = { version = "1", features = ["event"] }
# Bigger socket buffers than the system's defaults, for bursts.
socket2 = "0.6"
# HMAC-SHA256 for the server's address cookies and the member keys, and
# the server's secret (the same crates h2live already uses).
sha2 = "0.10"
getrandom = "0.3"
