[package]
name = "h2launch"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Starts MCC's classic Halo 2 engine (halo2.dll) from the owner's install, without MCC, for an offline multiplayer match"

[dependencies]
# Milestone 2: the engine's packets go between launchers through the relay.
h2relay = { path = "../h2relay" }
# --live: signing in to h2live and playing the matches it makes.
h2live = { path = "../h2live" }
h2net = { path = "../h2net" }
# The lobby's text in Halo 2's own fonts, read from MCC's halo2\h2_fonts.
blam-cache = { path = "../blam-cache" }
# --check: the SHA-256 of halo2.dll.
sha2 = "0.10"
# --screenshot: the back buffer written as a PNG.
png = "0.17"
# The lobby (docs/notes/launcher/lobby.md): its own window, drawn on the
# CPU, with text from a font on the PC, and Xbox controllers.
winit = "0.30"
softbuffer = "0.4"
ab_glyph = "0.2"
gilrs = { version = "0.11.2", default-features = false, features = ["xinput"] }

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Environment",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_XboxController",
    "Win32_UI_WindowsAndMessaging",
]
