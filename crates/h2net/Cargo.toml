[package]
name = "h2net"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "LAN games: hosting, joining and finding games on the local network"

[dependencies]
h2sim = { path = "../h2sim" }
flate2 = "1"
httparse = "1"
# ring rather than the default aws-lc-rs, which is hard to cross-compile for
# Windows.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
socket2 = "0.6"
tungstenite = "0.30"
webpki-roots = "1"

[dev-dependencies]
glam = "0.33"
rcgen = "0.14"
