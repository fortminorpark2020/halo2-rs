[package]
name = "h2live"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Online play, like Halo 2 on Xbox Live: accounts, parties, levels, playlists and matchmaking"

[dependencies]
h2sim = { path = "../h2sim" }
h2net = { path = "../h2net" }
ed25519-dalek = "2"
sha2 = "0.10"
getrandom = "0.3"
# For the program: stopping cleanly on Ctrl+C (and when a host stops it),
# and asking the router to open its port.
ctrlc = { version = "3", features = ["termination"] }
igd-next = "0.18"
# Waiting for something to come on any of its connections.
rustix = { version = "1", features = ["event"] }

[dev-dependencies]
glam = "0.33"
