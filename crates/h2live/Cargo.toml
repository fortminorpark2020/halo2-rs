[package]
name = "h2live"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Online play, like Halo 2 on Xbox Live: accounts, parties, levels, playlists and matchmaking"

[dependencies]
h2sim = { path = "../h2sim" }
h2net = { path = "../h2net" }
# The UDP relay for the launcher's game traffic, run beside the sign-in port.
h2relay = { path = "../h2relay" }
ed25519-dalek = "2"
sha2 = "0.10"
getrandom = "0.3"
# Owner-made accounts: argon2id password hashes at rest, and passwords
# sealed to the server on the wire (X25519, ChaCha20-Poly1305). All pure
# Rust.
# (zeroize: argon2 wipes its own working copies of the password's hash.)
argon2 = { version = "0.5.3", default-features = false, features = ["alloc", "password-hash", "zeroize"] }
chacha20poly1305 = { version = "0.10.1", default-features = false, features = ["alloc"] }
curve25519-dalek = "4.1"
zeroize = "1"
# For the program: stopping cleanly on Ctrl+C (and when a host stops it),
# and asking the router to open its port.
ctrlc = { version = "3", features = ["termination"] }
igd-next = "0.18"
# Waiting for something to come on any of its connections, and (for the
# command line) which user it runs as.
rustix = { version = "1", features = ["event", "process"] }

[dev-dependencies]
glam = "0.33"
# Connections from more than one of this PC's own addresses.
socket2 = "0.6"
