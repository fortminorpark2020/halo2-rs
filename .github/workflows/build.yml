name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: sudo apt-get update && sudo apt-get install -y libudev-dev libasound2-dev
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      # The game, h2tool and h2live (the online server).
      - uses: actions/upload-artifact@v4
        with:
          name: halo2-rs-windows
          path: target/release/*.exe

  # The online server's image, as Render builds and runs it: on the PORT it
  # is given, answering the health check.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f Dockerfile.live -t h2live .
      - name: Health check
        run: |
          docker run -d --name h2live -p 10000:10000 -e PORT=10000 h2live
          for i in $(seq 30); do
            if [ "$(curl -fs http://127.0.0.1:10000/health)" = OK ]; then
              docker logs h2live
              exit 0
            fi
            sleep 1
          done
          docker logs h2live
          exit 1
